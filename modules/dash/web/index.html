<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">

<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-180.png">
<script>{/* Link sends its approval pop-up back here when the person answers (buy.py --completion-callback-url, rich/buy.js): close it, or, opened as a tab, show the thread. The answer itself comes from Link's status, never from this address. */const q=new URLSearchParams(location.search);if(q.get("linkback")==="1"){const t=q.get("t")||"";try{window.close()}catch(e){}history.replaceState(null,"","/"+(/^[A-Za-z0-9_-]{1,64}$/.test(t)?"#comms/"+t:""))}}</script>
<script>{const t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}</script>
<script>{/* R-1125-d: the browser keeps 250 resource timings unless told more, and the load report (core/loadtime.js) counts and sums them. */try{performance.setResourceTimingBufferSize(2000)}catch(e){}}</script>
<script>{/* R-1125-c: was this load begun or left in a background tab? Read here, before the modules load; core/loadtime.js reports it. */window.h2LoadHidden=document.visibilityState==="hidden";document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")window.h2LoadHidden=true})}</script>

<style>#offline-line{position:fixed;left:0;right:0;top:0;z-index:9999;padding:calc(6px + env(safe-area-inset-top)) 12px 6px;background:#b45309;color:#fff;font:600 14px system-ui,sans-serif;text-align:center}#offline-line[hidden]{display:none}</style>
<script>{const f=()=>{let b=document.getElementById("offline-line");if(!b){if(navigator.onLine)return;b=document.createElement("div");b.id="offline-line";b.setAttribute("role","status");b.textContent="You\u2019re offline. Showing the last copy; new messages need a connection.";document.body.append(b)}b.hidden=navigator.onLine};addEventListener("online",f);addEventListener("offline",f);addEventListener("DOMContentLoaded",f)}</script>
</head><body class="app">
<script>{const m=location.hash.match(/^#comms\/(.+)/);if(m&&!/^(focus:|~list$|~new$)/.test(m[1]))document.body.dataset.view="thread";}</script>
<header class="top" id="top"><div><div class="top-in"></div><script>{let r=null;try{r=localStorage.getItem("chatRow")}catch(e){}if(r==="1"&&/^#?((comms|focus|needs|yours|inbox|mail|outbox|made|docs)(\/|$)|$)/.test(location.hash))document.currentScript.replaceWith(Object.assign(document.createElement("div"),{className:"cm-places"}))}</script></div></header>
<main id="main"><div class="page"><div class="empty skel" data-kind="loading" role="status"><span class="vh">Reading…</span><div class="skel-r"><span class="skel-b"></span><span class="skel-b"></span></div><div class="skel-r"><span class="skel-b"></span><span class="skel-b"></span></div><div class="skel-r"><span class="skel-b"></span><span class="skel-b"></span></div><div class="skel-r"><span class="skel-b"></span><span class="skel-b"></span></div></div></div></main>
<script>{const p=document.querySelector("#main .page"),h=location.hash;if(/^#yours(\/|$)/.test(h))p.dataset.view="yours";else if(/^#(needs|mail|inbox|settings|design|secrets|start)(\/|$)/.test(h))p.dataset.width="narrow";}</script>
