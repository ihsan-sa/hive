# Builds the three downloads on real machines of each system and checks each one starts.
# The Mac build is ad-hoc signed here (Apple silicon refuses a bundle with no signature at all); a paid Apple or Windows
# certificate, when there is one, goes in as secrets and electron-builder picks it up.
name: build
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, flags: "--linux", app: "dist/linux-unpacked/hive-app", run: "xvfb-run -a" }
          - { os: windows-latest, flags: "--win", app: "dist/win-unpacked/Hive.exe", run: "" }
          - { os: macos-15, flags: "--mac dmg zip --arm64 -c.mac.identity=-", app: "dist/mac-arm64/Hive.app/Contents/MacOS/Hive", run: "" }
          - { os: windows-11-arm, flags: "--win --x64", app: "dist/win-unpacked/Hive.exe", run: "", slow: "1" }
          - { os: macos-15-intel, flags: "--mac dmg zip --x64 -c.mac.identity=-", app: "dist/mac/Hive.app/Contents/MacOS/Hive", run: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npx electron-builder ${{ matrix.flags }} --publish never
      - run: node test/size.js dist
      # On the ARM runner: the chip Windows reports to this (x64, translated) job and the one it keeps in the registry, which the app hands the installer.
      - if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: 'Write-Host "process: $env:PROCESSOR_ARCHITECTURE  machine: $((Get-ItemProperty ''HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Environment'').PROCESSOR_ARCHITECTURE)"; wsl --status; wsl -l -v'
        continue-on-error: true
      - if: runner.os == 'macOS'
        run: codesign --verify --deep --strict --verbose=2 "$(dirname "$(dirname "$(dirname "${{ matrix.app }}")")")"
      - run: ${{ matrix.run }} node test/smoke.js "${{ matrix.app }}"
      - if: runner.os == 'Linux'
        run: xvfb-run -a node test/e2e.js && HIVE_APP_BIN="$PWD/${{ matrix.app }}" xvfb-run -a node test/e2e.js
      # The same stand-in test on a Mac (no accept step there): the setup, failure and repair screens, the proof check, one copy at a time.
      # On Windows the stand-in site serves a PowerShell install.ps1, and a compiled stand-in wsl.exe leads the PATH.
      - if: runner.os != 'Linux'
        shell: bash
        continue-on-error: true
        env: { HIVE_TEST_SLOW: "${{ matrix.slow }}" }
        run: node test/e2e.js && HIVE_APP_BIN="$PWD/${{ matrix.app }}" node test/e2e.js
      # The real install through the packaged app, on this throwaway machine: the site's installer, then the Hive's own web app in the window.
      - if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"; export XDG_RUNTIME_DIR=/run/user/$(id -u)
          for i in $(seq 20); do [ -S "$XDG_RUNTIME_DIR/bus" ] && break; sleep 1; done
          export DBUS_SESSION_BUS_ADDRESS=unix:path=$XDG_RUNTIME_DIR/bus
          HIVE_APP_REAL=1 xvfb-run -a node test/real.js "$PWD/${{ matrix.app }}"
      # The .deb as a person installs it: apt, then the command in its menu entry. The Hive from the step above is still there.
      # Then the update a Linux person does: the .deb built again one patch on, installed over it with apt.
      - if: runner.os == 'Linux'
        run: |
          export XDG_RUNTIME_DIR=/run/user/$(id -u) DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus
          sudo apt-get install -y ./dist/Hive-linux-amd64.deb
          NEXT=$(node -p "require('./package.json').version.replace(/[0-9]+$/, n => +n + 1)")
          npx electron-builder --linux deb --x64 --publish never -c.extraMetadata.version=$NEXT -c.directories.output=dist-next
          xvfb-run -a -s "-screen 0 1280x1024x24" node test/deb.js dist-next/Hive-linux-amd64.deb $NEXT
      # The same on Windows (its WSL 2) and on the Intel Mac (its VM; Apple silicon runners can't start one). These machines
      # differ from a person's computer, so a stop here is read, not a red build.
      # Which Linux systems the Windows runner already has before the install (the installer makes its own, "Hive").
      - if: runner.os == 'Windows'
        continue-on-error: true
        run: 'wsl -l -v; exit 0'
      - if: runner.os == 'Windows' || matrix.os == 'macos-15-intel'
        continue-on-error: true
        timeout-minutes: 75
        env: { HIVE_APP_REAL: "1" }
        run: node test/real.js "${{ matrix.app }}"
      # The file a Windows person downloads: Hive-Setup.exe with the browser's download mark, installed, opened from its
      # Start menu shortcut (the Hive from the step above, or the setup screen where there is none), then uninstalled.
      # On windows-latest it is also the update a person does: a second Hive-Setup.exe, one patch version on, goes over it.
      - if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          NEXT=$(node -p "require('./package.json').version.replace(/[0-9]+$/, n => +n + 1)")
          echo "HIVE_NEXT=$NEXT" >> "$GITHUB_ENV"
          npx electron-builder --win --publish never -c.extraMetadata.version=$NEXT -c.directories.output=dist-next
      - if: runner.os == 'Windows'
        timeout-minutes: 25
        shell: bash
        run: node test/setupexe.js dist/Hive-Setup.exe ${HIVE_NEXT:+dist-next/Hive-Setup.exe $HIVE_NEXT}
      # The zip a Mac person downloads: unpacked with the download mark, moved into /Applications, the README's Open
      # Anyway (its command-line form), then opened from there: it must go straight to the Hive from the step above.
      # Read, not a red build, like the real install it stands on.
      # Then the update a Mac person does: the zip built again one patch on, dragged over the app in /Applications.
      # On Apple silicon (no VM, so no Hive) the same download and update must open on the setup screen instead.
      - if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          NEXT=$(node -p "require('./package.json').version.replace(/[0-9]+$/, n => +n + 1)")
          ARCH=$(uname -m | sed s/x86_64/x64/)
          echo "HIVE_NEXT=$NEXT" >> "$GITHUB_ENV"
          echo "HIVE_ARCH=$ARCH" >> "$GITHUB_ENV"
          npx electron-builder --mac zip --$ARCH -c.mac.identity=- --publish never -c.extraMetadata.version=$NEXT -c.directories.output=dist-next
      - if: runner.os == 'macOS'
        continue-on-error: true
        timeout-minutes: 15
        env: { HIVE_DL_EXPECT: "${{ matrix.os == 'macos-15' && 'setup' || '' }}" }
        run: node test/macdl.js dist/Hive-mac-$HIVE_ARCH.zip ${HIVE_NEXT:+dist-next/Hive-mac-$HIVE_ARCH.zip $HIVE_NEXT}
      # The README's "Remove it" steps, run after the real install: nothing of the Hive may be left.
      - if: runner.os == 'Linux'
        run: HIVE_APP_REAL=1 node test/remove.js
      - if: runner.os == 'Windows' || matrix.os == 'macos-15-intel'
        continue-on-error: true
        timeout-minutes: 30
        env: { HIVE_APP_REAL: "1" }
        run: node test/remove.js
      # What opening the download looks like on a Mac: the zip unpacked with the browser's download mark, then double-clicked.
      - if: runner.os == 'macOS'
        continue-on-error: true
        timeout-minutes: 5
        run: bash test/downloaded.sh dist/*.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hive-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.deb
            dist/*.AppImage
            test/shots/*.png
          if-no-files-found: warn
          retention-days: 7
