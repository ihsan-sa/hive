name: release
# The Hive creates its own releases (gh release create) after a kept merge
# whose tests and dry run passed; this builds and attaches the binaries.
# Event data reaches scripts only through env ("$TAG"), never as ${{ }} inside run.
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        env:
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}; name=hive-$os-$arch
            [ "$os" = windows ] && name=$name.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/ihsan-sa/hive-standalone-build/internal/core.Version=$TAG -X github.com/ihsan-sa/hive-standalone-build/internal/core.DefaultReleaseRepo=$REPO" \
              -o dist/$name ./cmd/hive
          done
          (cd dist && sha256sum * > checksums.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  sign:
    # checksums.txt.sig: the tag and checksums signed with the owner's release key, which
    # every install pinning its public half (release.PublicKey) checks before installing.
    # Unsigned only while no key is pinned; hive-sign fails on a missing or wrong key.
    # This job runs the tagged commit's own hive-sign with the key, and the Hive cuts its
    # own releases, so it waits behind the protected "release" environment: the key is
    # exposed only once that environment's required reviewers approve. The key belongs in
    # that environment's secrets, so no other job can read it.
    needs: build
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: sign
        env:
          TAG: ${{ github.event.release.tag_name }}
          HIVE_RELEASE_KEY: ${{ secrets.HIVE_RELEASE_KEY }}
        run: |
          go run ./cmd/hive-sign "$TAG" dist/checksums.txt
          mkdir sig && if [ -f dist/checksums.txt.sig ]; then cp dist/checksums.txt.sig sig/; fi
      - uses: actions/upload-artifact@v4
        with:
          name: sig
          path: sig/
          if-no-files-found: ignore
  upload:
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v4
        # absent while no key is pinned and the release goes out unsigned
        continue-on-error: true
        with:
          name: sig
          path: dist/
      - name: upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: gh release upload "$TAG" dist/* --clobber -R "$REPO"
