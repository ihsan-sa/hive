name: many hives
# The Mac part runs in mac.yml, after its first Hive: one Mac install, not two, and the dated macOS waiver covers it with the rest of the Mac line.
on: {push: {branches: [test-many-hives, test-train]}}
permissions: {contents: read}
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        image:
          - {name: ubuntu-24.04, url: "https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img"}
          - {name: debian-12, url: "https://cloud.debian.org/images/cloud/bookworm/latest/debian-12-genericcloud-amd64.qcow2"}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
    - name: Give this user KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
        sudo udevadm control --reload-rules; sudo udevadm trigger --name-match=kvm
    - name: Install QEMU
      run: sudo apt-get update -qq; sudo apt-get install -y -qq qemu-system-x86 qemu-utils cloud-image-utils
    - name: Several Hives on one machine
      env:
        IMAGE_URL: ${{ matrix.image.url }}
        INSIDE: inside-many.sh
        HIVE_BRANCH: train-candidate
        INSTALL_URL: https://raw.githubusercontent.com/ihsan-sa/hive/train-candidate/get.sh
      run: bash run-vm.sh
  windows:
    runs-on: windows-2025
    timeout-minutes: 40   # ~13 min, ten of them idle on purpose; under the train's hour
    steps:
      - uses: actions/checkout@v4
      - name: Several Hives in the one Hive WSL system
        shell: powershell
        run: ./win-many.ps1
