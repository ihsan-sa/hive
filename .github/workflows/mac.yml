name: macos
on: { push: { branches: [test-train, test-mac-many] } }
permissions: { contents: read }
jobs:
  install:
    # Intel: GitHub's Apple-silicon Macs can't start a VM inside, so only this one runs the real line end to end.
    runs-on: macos-15-intel
    timeout-minutes: 58   # under the train's hour of waiting (release_train.py rig()); the line ~21 min, its second Hive ~4
    env:
      HIVE_SITE: https://raw.githubusercontent.com/ihsan-sa/hive/train-candidate
      HIVE_BRANCH: train-candidate
      HIVE_CHECK_AUTO: "1"
    steps:
    - uses: actions/checkout@v4
      with: { ref: train-candidate }
    - uses: actions/checkout@v4
      with: { path: rig }
    - name: Where this runs
      run: sw_vers; uname -m; sysctl -n hw.memsize hw.ncpu
    - name: The login item is valid for plutil
      run: |
        sed '/^main "\$@"$/d' get-mac.sh > funcs.sh
        ( set +e; . ./funcs.sh; D="$HOME/.hive"; agent_plist > hive.plist ); plutil -lint hive.plist
    - name: The candidate's Mac line, real Lima, real VM, no person
      timeout-minutes: 42
      run: |
        set -o pipefail
        # On the site install.sh is get.sh; on the raw branch it is the inner script, so point the VM at get.sh (as win-test.ps1 does)
        sed 's|"$SITE/install.sh"|"$SITE/get.sh"|' get-mac.sh > line.sh; ! cmp -s get-mac.sh line.sh
        # To a file, not a pipe: a VM program the script leaves behind would hold the pipe open and the step would run to its 42 minutes with no verdict.
        # No voice build in the rig: it starves the 3-core runner VM and the session never closes.
        HIVE_VOICE=0 HIVE_CHECK_LINE=line.sh sh mac-check.sh > install.log 2>&1 < /dev/null || true
        tail -n 80 install.log
        grep -q '^done, 0 failed\.' install.log && ! grep -q '^done, [1-9][0-9]* failed' install.log
    - name: Two more Hives beside it, installed at once (rig/mac-many.sh; many.yml does Linux and Windows)
      # mac-many.sh stops the two installs itself after 13 min (MANY_LIMIT) and shows why, so this limit is only a backstop.
      timeout-minutes: 16
      run: sh rig/mac-many.sh < /dev/null
    - name: The report
      if: always()
      run: cat "$HOME/hive-mac-report.txt" || true
    - name: Lima's log
      if: failure()
      run: |
        for f in ha.stderr.log serial.log serialv.log serialp.log; do echo "=== $f"; tail -n 60 "$HOME/.hive/lima/hive/$f" 2>/dev/null || true; done
        ls -la "$HOME/.hive/lima/hive" 2>/dev/null || true
        ps -axo pid,etime,command | grep -i -E 'lima|hive' | grep -v grep | cut -c1-200 || true
        echo "=== inside the VM"
        L="$HOME/.hive/lima-dist/bin/limactl"
        perl -e 'alarm 60; exec @ARGV' "$L" shell --workdir / hive sh -c 'ps -eo pid,ppid,etime,stat,args --forest | cut -c1-200; echo ---; tail -n 30 /home/hive/.h2/voice-setup.log 2>/dev/null; journalctl -n 30 --no-pager 2>/dev/null | cut -c1-200' </dev/null || true
    - name: Uninstall, for real
      if: always()
      timeout-minutes: 8
      run: |
        # hive-two and hive-work first: the last Hive left takes the VM with it, whichever it is (mac-many.sh removes hive when it gets that far; otherwise the last line does)
        { sleep 5; echo delete; sleep 5; } | HIVE_USER=hive-two HIVE_KEEP=projects,notes,board script -q /dev/null sh remove-mac.sh || true
        { sleep 5; echo delete; sleep 5; } | HIVE_USER=hive-work HIVE_KEEP=projects,notes,board script -q /dev/null sh remove-mac.sh || true
        { sleep 5; echo delete; sleep 5; } | HIVE_KEEP=projects,notes,board script -q /dev/null sh remove-mac.sh || true
        sleep 5; sh mac-check.sh --after-uninstall || true
