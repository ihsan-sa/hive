name: clean-vm
on: {push: {branches: [test-userns-2204]}}
permissions: {contents: read}
jobs:
  vm:
    strategy:
      fail-fast: false
      matrix:
        image:
          - {name: ubuntu-22.04, url: "https://cloud-images.ubuntu.com/jammy/current/jammy-server-cloudimg-amd64.img"}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v4
    - name: Give this user KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
        sudo udevadm control --reload-rules; sudo udevadm trigger --name-match=kvm; ls -l /dev/kvm
    - name: Install QEMU
      run: sudo apt-get update -qq; sudo apt-get install -y -qq qemu-system-x86 qemu-utils cloud-image-utils
    - name: Clean machine test
      env: {IMAGE_URL: "${{ matrix.image.url }}", HIVE_BRANCH: ""}  # set HIVE_BRANCH to test a candidate
      run: bash run-vm.sh
