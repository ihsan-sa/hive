name: update
# A Hive installed from an older release updates itself to the release under test while it
# runs, on all three systems. `previous` is the newest full release before it, installed as
# `hive`; v0.1.2 is installed as `hive-v0` from the repo's old name, so its update also goes
# through GitHub's rename redirect and renames the command to `hive`. A manual run tests the
# latest release, or the tag given: gh workflow run update.yml -f tag=v0.1.3
#
# The Hive cuts each release as a pre-release and makes it the latest only once this and ci
# pass on its commit (internal/mod/release). Old releases update only to the latest, so a
# pre-release is handed over as an update hands over: the binary is swapped in place and the
# new one takes over from the old daemon (`daemon --detach --wait-for`), reading its
# daemon.json and renaming a v0.1.2 hive-v0. Once it is the latest, `released` runs the whole
# update again, by itself.
on:
  release:
    types: [published, released]
  workflow_dispatch:
    inputs:
      tag:
        description: release to update to (default the latest)
        required: false
permissions:
  contents: read
jobs:
  update:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        from: [previous, v0.1.2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: pick the releases
        id: pick
        env:
          TO: ${{ github.event.release.tag_name || inputs.tag }}
          FROM: ${{ matrix.from }}
        run: |
          to=${TO:-$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName)}
          # A release's own run waits for the binaries the release workflow attaches, as install-smoke does;
          # a manual run names a release that should have them already, so it checks once.
          tries=1; [ "$GITHUB_EVENT_NAME" = release ] && tries=60
          for i in $(seq $tries); do
            n=$(gh release view "$to" -R "$GITHUB_REPOSITORY" --json assets -q '.assets | length') || n=0
            [ "$n" -ge 6 ] && break
            echo "waiting for $to's binaries ($n so far)"; sleep 20
          done
          [ "$n" -ge 6 ] || { echo "::error::release $to never got its binaries"; exit 1; }
          pre=$(gh release view "$to" -R "$GITHUB_REPOSITORY" --json isPrerelease -q .isPrerelease)
          if [ "$FROM" = previous ]; then
            # the newest full release before it: what installs are on (a red pre-release never was)
            from=$(gh release list -R "$GITHUB_REPOSITORY" --exclude-drafts --limit 100 --json tagName,isPrerelease |
              jq -r --arg to "$to" '(map(.tagName) | index($to)) as $i | if $i == null then empty else .[$i+1:] | map(select(.isPrerelease | not)) | .[0].tagName // empty end')
            cmd=hive repo=$GITHUB_REPOSITORY
          else
            from=$FROM cmd=hive-v0 repo=ihsan-sa/hive-standalone-build
          fi
          skip=false
          if [ -z "$from" ] || [ "$from" = "$to" ]; then skip=true; echo "::warning::nothing to update from: from '$from', to $to"; fi
          echo "from $from ($cmd) to $to (pre-release: $pre); skip=$skip"
          bin=$RUNNER_TEMP/bin
          { echo "to=$to"; echo "pre=$pre"; echo "from=$from"; echo "cmd=$cmd"; echo "repo=$repo"; echo "skip=$skip"; echo "bin=$bin"; } >> "$GITHUB_OUTPUT"
          { echo "HIVE_HOME=$RUNNER_TEMP/hive"; echo "HIVE_BIN_DIR=$bin"; } >> "$GITHUB_ENV"
      - name: install the old release (Linux, macOS)
        if: steps.pick.outputs.skip == 'false' && runner.os != 'Windows'
        env:
          HIVE_VERSION: ${{ steps.pick.outputs.from }}
          HIVE_CMD: ${{ steps.pick.outputs.cmd }}
          HIVE_REPO: ${{ steps.pick.outputs.repo }}
        run: sh install/install.sh
      - name: install the old release (Windows)
        if: steps.pick.outputs.skip == 'false' && runner.os == 'Windows'
        shell: pwsh
        env:
          HIVE_VERSION: ${{ steps.pick.outputs.from }}
          HIVE_CMD: ${{ steps.pick.outputs.cmd }}
          HIVE_REPO: ${{ steps.pick.outputs.repo }}
          HIVE_SKIP_WSL: '1'
          HIVE_NO_PATH: '1'
        run: ./install/install.ps1
      - name: start it with auto-update off, then turn it on while it runs
        if: steps.pick.outputs.skip == 'false'
        env:
          CMD: ${{ steps.pick.outputs.cmd }}
          BIN: ${{ steps.pick.outputs.bin }}
          PRE: ${{ steps.pick.outputs.pre }}
        run: |
          mkdir -p "$HIVE_HOME/.hive"
          conf() { printf '{"harness": "fake", "auto_update": %s, "schedules": {"hive.update": "every 1m"}}\n' "$1" > "$HIVE_HOME/.hive/config.json"; }
          conf false
          "$BIN/$CMD" daemon --detach
          "$BIN/$CMD" status
          sleep 45 # past the at-start check, which finds auto-update off
          # A pre-release isn't what the old release follows: auto-update stays off and the next step hands it over.
          [ "$PRE" = true ] || conf true
      - name: hand the pre-release over as an update would
        if: steps.pick.outputs.skip == 'false' && steps.pick.outputs.pre == 'true'
        env:
          TO: ${{ steps.pick.outputs.to }}
          CMD: ${{ steps.pick.outputs.cmd }}
          BIN: ${{ steps.pick.outputs.bin }}
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) asset=hive-linux-amd64 ;; Linux-ARM64) asset=hive-linux-arm64 ;;
            macOS-X64) asset=hive-darwin-amd64 ;; macOS-ARM64) asset=hive-darwin-arm64 ;;
            Windows-X64) asset=hive-windows-amd64.exe ;; *) echo "::error::no asset for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
          esac
          ext=; [ "$RUNNER_OS" = Windows ] && ext=.exe
          gh release download "$TO" -R "$GITHUB_REPOSITORY" -p "$asset" -D "$RUNNER_TEMP/new"
          # Releases before v0.1.4 keep daemon.json in .hive. A restarting daemon leaves it behind
          # for the new one, so it is kept across the old daemon's stop.
          info=$HIVE_HOME/.hive/private/daemon.json; [ -f "$info" ] || info=$HIVE_HOME/.hive/daemon.json
          cp "$info" "$RUNNER_TEMP/daemon.json"; cat "$info"; echo
          pid=$(sed -n 's/.*"pid": *\([0-9]*\).*/\1/p' "$info")
          "$BIN/$CMD" shutdown
          cp "$RUNNER_TEMP/daemon.json" "$info"
          # Windows holds the exe a moment after its process ends.
          for i in $(seq 10); do cp "$RUNNER_TEMP/new/$asset" "$BIN/$CMD$ext" && break; sleep 2; done
          chmod +x "$BIN/$CMD$ext"
          "$BIN/$CMD" daemon --detach --wait-for "$pid"
      - name: it moves to the new release by itself
        if: steps.pick.outputs.skip == 'false'
        env:
          TO: ${{ steps.pick.outputs.to }}
          BIN: ${{ steps.pick.outputs.bin }}
        run: |
          info=$HIVE_HOME/.hive/private/daemon.json # where the new release writes it
          for i in $(seq 60); do
            grep -q "\"version\":\"$TO\"" "$info" 2>/dev/null && break
            sleep 5
          done
          cat "$info"; echo
          grep -q "\"version\":\"$TO\"" "$info"
          "$BIN/hive" --version | tee version.txt
          grep -q "$TO" version.txt
          "$BIN/hive" status | tee status.txt
          grep -q "^Hive $TO " status.txt
          "$BIN/hive" update | tee update.txt
          grep -q "already on $TO" update.txt
      - name: hive-v0 still works, as an alias of hive
        if: steps.pick.outputs.skip == 'false' && steps.pick.outputs.cmd == 'hive-v0'
        env:
          TO: ${{ steps.pick.outputs.to }}
          BIN: ${{ steps.pick.outputs.bin }}
        run: |
          if [ "$RUNNER_OS" = Windows ]; then cmd.exe //c "$(cygpath -w "$BIN/hive-v0.cmd")" status | tee alias.txt
          else "$BIN/hive-v0" status | tee alias.txt; fi
          grep -q "^Hive $TO " alias.txt
      - name: a reinstall retires an old Programs\hive-v0 and keeps the user PATH as stored (Windows)
        if: steps.pick.outputs.skip == 'false' && runner.os == 'Windows' && steps.pick.outputs.cmd == 'hive-v0'
        shell: pwsh
        env:
          HIVE_VERSION: ${{ steps.pick.outputs.to }}
          HIVE_REPO: ${{ github.repository }}
          HIVE_SKIP_WSL: '1'
          HIVE_NO_PATH: '1'
          BIN: ${{ steps.pick.outputs.bin }}
        run: |
          # A pwsh failure leaves no annotation, and job logs need a login: name it in one.
          try {
            ./install/path_check.ps1
            # The updated daemon stands in for the old install: the installer must stop it,
            # point its login autostart at the new install and remove the old folder.
            $old = Join-Path $env:LOCALAPPDATA 'Programs\hive-v0'
            New-Item -ItemType Directory -Force $old | Out-Null
            Copy-Item (Join-Path $env:BIN 'hive.exe') (Join-Path $old 'hive-v0.exe')
            $run = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
            if (-not (Test-Path $run)) { New-Item $run | Out-Null } # the runner's profile has no Run key
            Set-ItemProperty $run -Name Hive -Value "`"$old\hive-v0.exe`" daemon --detach"
            $k = [Microsoft.Win32.Registry]::CurrentUser.CreateSubKey('Environment')
            $path = ($k.GetValue('Path', '', 'DoNotExpandEnvironmentNames') -split ';' | Where-Object { $_ }) -join ';'
            $k.SetValue('Path', "$path;$old", 'ExpandString')
            ./install/install.ps1
            $got = (Get-ItemProperty $run -Name Hive).Hive
            Remove-ItemProperty $run -Name Hive
            if (Test-Path $old) { throw 'the old folder is still there' }
            if ($got -like '*hive-v0*' -or $got -notlike '*hive.exe" daemon --detach') { throw "the autostart is '$got'" }
            $now = $k.GetValue('Path', '', 'DoNotExpandEnvironmentNames')
            if ($now -cne $path -or $k.GetValueKind('Path') -ne 'ExpandString') { throw "the user PATH went from '$path;$old' to '$now' ($($k.GetValueKind('Path')))" }
          } catch {
            Write-Host "::error::$(($_.Exception.Message + ' ' + $_.InvocationInfo.PositionMessage) -replace '%', '%25' -replace '\r?\n', '%0A')"
            throw
          }
      - name: the daemon's log
        if: always() && steps.pick.outputs.skip == 'false'
        run: |
          ls -la "$HIVE_BIN_DIR" || true
          cat "$HIVE_HOME/.hive/daemon.log" || true
          "$HIVE_BIN_DIR/hive" shutdown || true
