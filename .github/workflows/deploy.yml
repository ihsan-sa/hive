name: deploy
on: {push: {branches: [test-deploy]}}
permissions: {contents: read}
jobs:
  cloud-init:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v4
    - name: Give this user KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
        sudo udevadm control --reload-rules; sudo udevadm trigger --name-match=kvm; ls -l /dev/kvm
    - name: Install QEMU
      run: sudo apt-get update -qq; sudo apt-get install -y -qq qemu-system-x86 qemu-utils cloud-image-utils python3-yaml
    - name: A new Ubuntu 24.04 server with the cloud-init file as its only setup
      run: bash run-cloud-init.sh
