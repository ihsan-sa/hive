name: ci
# PRs, a published release and a manual run (gh workflow run ci) get all three systems, so a
# change that's red on macOS or Windows is caught before it merges, not at the next release.
# Pushes to main run on Linux only: their PR already ran the rest, and macOS minutes bill at
# 10x and Windows at 2x.
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
concurrency:
  # Keyed by event too, so a push to main never cancels a manual three-system run on main.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false # a release's run names every system's failures, not only the first
      matrix:
        os: ${{ fromJSON(github.event_name == 'push' && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: the suite (tests/green.sh)
        shell: bash
        run: tests/green.sh 2>&1 | tee "$RUNNER_TEMP/suite.log"
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@localhost
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@localhost
      # Job logs need a login; annotations don't, so the Hive can read what failed.
      - name: name the failing tests
        if: failure()
        shell: bash
        run: |
          grep -n -e '--- FAIL' -e '^panic:' "$RUNNER_TEMP/suite.log" | head -20 | while IFS=: read -r n _; do
            echo "::error::$(sed -n "$n,$((n + 30))p" "$RUNNER_TEMP/suite.log" | awk 'BEGIN { ORS = "%0A" } { gsub(/\r/, ""); gsub(/%/, "%25"); print substr($0, 1, 300) }')"
          done
      # After the suite, so a cross-system vet failure never hides the Linux result,
      # and !cancelled(), so a Linux failure never hides a cross-system one.
      - name: vet darwin
        if: "!cancelled() && matrix.os == 'ubuntu-latest'"
        shell: bash
        run: GOOS=darwin go vet ./...
      - name: vet windows
        if: "!cancelled() && matrix.os == 'ubuntu-latest'"
        shell: bash
        run: GOOS=windows go vet ./...
  sandboxed-e2e:
    # The end to end with agents under bubblewrap, the default sandbox on Linux, so a sandbox
    # break goes red on a PR. The runner's Ubuntu blocks unprivileged user namespaces through
    # AppArmor; lifting that lets bwrap make them, and HIVE_SANDBOX_BWRAP=1 keeps the hive on
    # the bwrap path it takes on a stock Ubuntu.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: bubblewrap and user namespaces
        run: |
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: probe the sandbox first
        # Fails the job unless the hive runs a sandboxed command through bwrap here, so the
        # suite below can't go green on bare or on the build's own namespaces.
        # Select calls sb.Check() (internal/sandbox/sandbox.go:96), and Linux.Check is Probe(), which runs a sandboxed command.
        shell: bash
        run: |
          go build -o "$RUNNER_TEMP/hive" ./cmd/hive
          "$RUNNER_TEMP/hive" sandbox-probe | grep -x "ok bubblewrap"
        env:
          HIVE_SANDBOX_BWRAP: "1"
      - name: the host's python runs under bubblewrap
        # TestHostPythonBothPaths skips a path the host can't run, so the grep fails the job
        # unless its bubblewrap half really ran and passed.
        shell: bash
        run: |
          go test ./internal/sandbox/ -run 'BothPaths' -v | tee "$RUNNER_TEMP/both.log"
          grep -q -- "--- PASS: TestHostPythonBothPaths/bubblewrap" "$RUNNER_TEMP/both.log"
      - name: end to end under bubblewrap
        run: go test ./internal/e2e/ -timeout 30m
        env:
          HIVE_E2E_SANDBOX: auto
          HIVE_SANDBOX_BWRAP: "1"
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@localhost
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@localhost
  old-releases:
    # update.yml runs this checkout's installers to install an older release, which lacks
    # commands added since (v0.1.33's installer called `report`, new in v0.1.18, and every
    # update leg failed with a usage error). This catches that at the PR, not the release.
    # The installer is the same script on macOS, so Linux and Windows run it.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        from: [latest, v0.1.2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: pick the release
        env:
          FROM: ${{ matrix.from }}
        run: |
          if [ "$FROM" = latest ]; then
            # the newest full release: what installs are on, and update.yml's `previous`
            echo "HIVE_VERSION=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName)" >> "$GITHUB_ENV"
            echo "HIVE_CMD=hive" >> "$GITHUB_ENV"; echo "HIVE_REPO=$GITHUB_REPOSITORY" >> "$GITHUB_ENV"
          else
            echo "HIVE_VERSION=$FROM" >> "$GITHUB_ENV"
            echo "HIVE_CMD=hive-v0" >> "$GITHUB_ENV"; echo "HIVE_REPO=ihsan-sa/hive-standalone-build" >> "$GITHUB_ENV"
          fi
          { echo "HIVE_HOME=$RUNNER_TEMP/hive"; echo "HIVE_BIN_DIR=$RUNNER_TEMP/bin"; } >> "$GITHUB_ENV"
      - name: install it (Linux)
        if: runner.os != 'Windows'
        run: sh install/install.sh
      - name: install it (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          HIVE_SKIP_WSL: '1'
          HIVE_NO_PATH: '1'
        run: ./install/install.ps1
      - name: it is the release asked for
        run: |
          "$HIVE_BIN_DIR/$HIVE_CMD" --version | tee version.txt
          grep -q "$HIVE_VERSION" version.txt
