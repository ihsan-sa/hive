name: ci
# Linux only for now, on the person's word (issue #564): macOS and Windows are paused until the
# self-improvement loop is tight, so nothing in the merge path waits on them. To bring them back,
# add macos-latest and windows-latest to the test matrix (and to runners in
# internal/mod/release/prerelease.go) and the cross-system vet steps. Keep windows-latest in
# the matrix for pushes to main too (issue #595; before the pause pushes ran Linux only): a PR
# red on Windows is weighed against main's result for the same check, and without a Windows
# run on main a Windows-only red first surfaces on an unrelated PR.
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
concurrency:
  # Keyed by event too, so a push to main never cancels a manual run on main. A PR's runs
  # share a group and its superseded run is cancelled. Every other run (a push to main
  # above all) gets a group of its own, keyed by its commit: GitHub keeps one running and
  # one pending run per group and cancels the older pending one when a third arrives,
  # whatever cancel-in-progress says, so a shared group left most of main's pushes with no
  # result (issue #1057) and a release waiting on one waited forever.
  # Two manual (or release) runs on one commit still share a group, so a third replaces the
  # pending one: harmless, since they test the same code.
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# Read-only whatever the repository's default is: no job here writes to it.
permissions:
  contents: read
jobs:
  # A Hive following pre-releases reads this job as "test (<os>-latest)" and sandboxed-e2e as
  # Linux's own (ownJobs and alsoOwn in internal/mod/release/prerelease.go); keep them unnamed.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: the suite (tests/green.sh)
        shell: bash
        run: tests/green.sh 2>&1 | tee "$RUNNER_TEMP/suite.log"
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@localhost
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@localhost
      # Job logs need a login; annotations don't, so the Hive can read what failed.
      - name: name the failing tests
        if: failure()
        shell: bash
        run: |
          grep -n -e '--- FAIL' -e '^panic:' "$RUNNER_TEMP/suite.log" | head -20 | while IFS=: read -r n _; do
            echo "::error::$(sed -n "$n,$((n + 30))p" "$RUNNER_TEMP/suite.log" | awk 'BEGIN { ORS = "%0A" } { gsub(/\r/, ""); gsub(/%/, "%25"); print substr($0, 1, 300) }')"
          done
  sandboxed-e2e:
    # The end to end with agents under bubblewrap, the default sandbox on Linux, so a sandbox
    # break goes red on a PR. The runner's Ubuntu blocks unprivileged user namespaces through
    # AppArmor; lifting that lets bwrap make them, and HIVE_SANDBOX_BWRAP=1 keeps the hive on
    # the bwrap path it takes on a stock Ubuntu.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: bubblewrap and user namespaces
        run: |
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: probe the sandbox first
        # Fails the job unless the hive runs a sandboxed command through bwrap here, so the
        # suite below can't go green on bare or on the build's own namespaces.
        # Select calls sb.Check() (internal/sandbox/sandbox.go:96), and Linux.Check is Probe(), which runs a sandboxed command.
        shell: bash
        run: |
          go build -o "$RUNNER_TEMP/hive" ./cmd/hive
          "$RUNNER_TEMP/hive" sandbox-probe | grep -x "ok bubblewrap"
        env:
          HIVE_SANDBOX_BWRAP: "1"
      - name: the host's python runs under bubblewrap
        # TestHostPythonBothPaths skips a path the host can't run, so the grep fails the job
        # unless its bubblewrap half really ran and passed.
        shell: bash
        run: |
          go test ./internal/sandbox/ -run 'BothPaths' -v | tee "$RUNNER_TEMP/both.log"
          grep -q -- "--- PASS: TestHostPythonBothPaths/bubblewrap" "$RUNNER_TEMP/both.log"
      - name: end to end under bubblewrap
        run: go test ./internal/e2e/ -timeout 30m
        env:
          HIVE_E2E_SANDBOX: auto
          HIVE_SANDBOX_BWRAP: "1"
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@localhost
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@localhost
