name: ci
# Pushes to main and PRs run on Linux only, because macOS minutes bill at 10x and Windows at 2x.
# A published release or a manual run gets all three systems: gh workflow run ci
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
concurrency:
  # Keyed by event too, so a push to main never cancels a manual three-system run on main.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      matrix:
        os: ${{ fromJSON((github.event_name == 'release' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: the suite (tests/green.sh)
        shell: bash
        run: tests/green.sh
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@localhost
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@localhost
  sandboxed-e2e:
    # The end to end with agents under bubblewrap, the default sandbox on Linux, so a sandbox
    # break goes red on a PR. The runner's Ubuntu blocks unprivileged user namespaces through
    # AppArmor; lifting that lets bwrap make them, and HIVE_SANDBOX_BWRAP=1 keeps the hive on
    # the bwrap path it takes on a stock Ubuntu.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: bubblewrap and user namespaces
        run: |
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: end to end under bubblewrap
        run: go test ./internal/e2e/ -timeout 30m
        env:
          HIVE_E2E_SANDBOX: auto
          HIVE_SANDBOX_BWRAP: "1"
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@localhost
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@localhost
