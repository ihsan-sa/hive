name: old-releases
# update.yml runs this checkout's installers to install an older release, which lacks
# commands added since (v0.1.33's installer called `report`, new in v0.1.18, and every
# update leg failed with a usage error). This catches that at the PR, not the release.
# Linux only for now (issue #564); when Windows comes back, so do its install.ps1 legs and
# steps (git show 65b1651:.github/workflows/old-releases.yml). A PR runs it only when it
# touches the installers or the commands they call, to spare the minutes on every other PR;
# a published release and a manual run (gh workflow run old-releases) always do.
on:
  pull_request:
    paths:
      - install/**
      - cmd/hive/main.go
      - cmd/hive/report.go
      - .github/workflows/old-releases.yml
  release:
    types: [published]
  workflow_dispatch:
concurrency:
  group: old-releases-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest] # Linux only for now (issue #564)
        from: [latest, v0.1.2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: pick the release
        # The token is this step's alone: the installers and the old binaries never see it.
        env:
          FROM: ${{ matrix.from }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$FROM" = latest ]; then
            # the newest full release: what installs are on, and update.yml's `previous`
            v=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName)
            echo "HIVE_CMD=hive" >> "$GITHUB_ENV"; echo "HIVE_REPO=$GITHUB_REPOSITORY" >> "$GITHUB_ENV"
          else
            v=$FROM
            echo "HIVE_CMD=hive-v0" >> "$GITHUB_ENV"; echo "HIVE_REPO=ihsan-sa/hive-standalone-build" >> "$GITHUB_ENV"
          fi
          # An empty version would install `latest` and pass the grep below on anything.
          [ -n "$v" ] || { echo "::error::no release to install"; exit 1; }
          echo "HIVE_VERSION=$v" >> "$GITHUB_ENV"
          { echo "HIVE_HOME=$RUNNER_TEMP/hive"; echo "HIVE_BIN_DIR=$RUNNER_TEMP/bin"; } >> "$GITHUB_ENV"
      - name: install it
        run: sh install/install.sh
      - name: it is the release asked for
        run: |
          "$HIVE_BIN_DIR/$HIVE_CMD" --version | tee version.txt
          grep -qwF -- "$HIVE_VERSION" version.txt
