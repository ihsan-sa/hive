# Files where a mistake weakens the sandbox, leaks a credential or runs
# something outside the sandbox. The lander merges a PR that touches one of
# these only after a security read of the PR's own diff, and never takes the
# light path for it. The Hive gives that read itself: a security reviewer
# separate from the ordinary one (another model, briefed on the sandbox,
# credentials and what runs outside it), and for a root entry below a
# majority of a three-seat panel as well. A read from the box's perms seat or
# architect, recorded with `hive read`, counts in their place, and its fix
# sends the PR back. Paths are relative to the repo root; `*` stays inside
# one path segment and `**` crosses segments. Every entry adds a read to each
# PR that touches it, so keep the list narrow.
paths = [
  # This file and the script that decides what counts as green.
  "tests/LANDING-security.toml",
  "tests/green.sh",

  # The sandbox boundary: bwrap, Seatbelt, WSL and egress filtering.
  "internal/sandbox/**",

  # Runs approved scripts in the daemon, outside the sandbox.
  "internal/mod/risk/**",

  # Decides which modules are installed and which projects may use them.
  "internal/mod/modules/**",

  # Runs a module's program as the person, outside the sandbox.
  "internal/mod/runner/**",

  # A shipped module's manifest names the program the runner starts as the
  # person (exec) and the API scopes it gets (hooks); a shipped module has no
  # module-reviewer read, so its program's source needs this one.
  "modules/*/module.json",
  "modules/kb/dream/**",

  # Mounts and covers for a run, effects applied outside the sandbox, the
  # hard ceiling, login and token handling, and the workspace paths that
  # define what is private.
  "internal/core/runs.go",
  "internal/core/effects.go",
  "internal/core/ceiling.go",
  "internal/core/tokens.go",
  "internal/core/forge.go",
  "internal/core/workspace.go",

  # Which Hive may merge and release in the release repository.
  "internal/core/steward.go",

  # Which sandbox a run gets, which ops a run may call, and git and gh run
  # on the host, outside the sandbox.
  "internal/core/core.go",
  "internal/core/ops.go",
  "internal/core/git.go",

  # First run and setup: login, autostart and uninstall.
  "internal/setup/**",
  "cmd/hive/firstrun.go",

  # The daemon's bearer token and module scoping.
  "internal/daemon/**",

  # Which credentials reach an agent's turn.
  "internal/harness/**",

  # Agents' reads of GitHub on the person's login: which repos and paths.
  "internal/mod/forgeread/**",

  # The open harness holds a model's key and runs the model's shell commands;
  # routes decide which model and endpoint a run's turn goes to.
  "internal/openagent/**",
  "internal/core/route.go",

  # The route op and the person's yes that it waits for before a check seat
  # (reviewer, security, warden, tribunal) moves to another model.
  "internal/mod/models/**",

  # Self-update and install scripts.
  "install/**",
  "internal/mod/release/**",

  # The identity and secret scan on every release and export, and the list of
  # the files a release publishes, which it reads.
  "internal/mod/scan/**",
  "cmd/hive-scan/**",
  ".hive/public.txt",

  # CI and release workflows run with repository secrets.
  ".github/workflows/**",

  # Which third-party code the binary is built from.
  "go.mod",
  "go.sum",
]

# The forge's checks that must succeed on a PR's exact head before the Hive
# merges it (read from main). Neutral, skipped or not reported yet holds the
# merge like a check still running. Names as GitHub lists them on a PR.
required_checks = [
  "test (ubuntu-latest)",
  "sandboxed-e2e",
]

# The forge's checks that only warn on the Hive's own PRs (read from main): red
# here, one doesn't send the change back, and pending or unable to start it
# isn't waited on; the task and PR say so. A release still needs them green.
# Exact names; a check left off holds the merge as any other does. Windows is
# paused for now (issue #564); this keeps its job advisory when it returns.
advisory_checks = [
  "test (windows-latest)",
]

# What runs with elevated rights: CI and release with the repository's
# secrets, install, setup and self-update. A PR that touches one also needs
# the Hive's panel (PanelSeats seats over tribunal_models) to say land by a
# majority. A root entry is on the list whether or not paths names it.
root = [
  ".github/workflows/**",
  "install/**",
  "internal/setup/**",
  "internal/mod/release/**",
]

# The code that enforces the hard limits: money, credentials, private details
# going out, anything outward in the person's name, and deleting a repository
# or its history. Everything else lands with no read, the core included; a
# change to one of these merges only once a warden has read its exact diff
# (core.LimitsHeld; the person, 10-30: "maybe a change to the warden code
# needs a warden"). A revert the Hive makes needs none. The limits are meant
# to hold outside this code too (token scopes, the forge's rulesets, the
# accounts' spend limits): this read is the in-code half. Read from main, so
# a change can't move its own bar; keep it narrow, as each entry is a wait.
limits = [
  # This list, and the check that reads it.
  "tests/LANDING-security.toml",
  "internal/core/limits.go",
  "internal/mod/work/limits.go",

  # What is always the person's and what goes to a warden.
  "internal/core/ceiling.go",

  # Wardens, tribunals and the approved scripts they run outside the sandbox.
  "internal/mod/risk/**",

  # The scan for private details on every release and export, and the list of
  # what a release publishes.
  "internal/mod/scan/**",
  "cmd/hive-scan/**",
  ".hive/public.txt",

  # What an agent's turn can reach: credentials covered, egress filtered.
  "internal/sandbox/**",

  # Which token a push or merge goes out on.
  "internal/core/tokens.go",
]
