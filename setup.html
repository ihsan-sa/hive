<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src file:">
<title>Hive</title>
<style>
  :root { color-scheme: dark light;
    --bg:#111; --fg:#eee; --p:#c8c8c8; --small:#999; --bd:#444; --btn:#1c1c1c; --prebd:#2a2a2a; --prebg:#000; --pre:#cfcfcf; --spin:#555; --focus:#fff; --err:#ff8a80; --row:#181818; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; align-items: center; justify-content: center; }
  main { width: min(680px, 92vw); padding: 24px 0; }
  img { width: 72px; height: 72px; border-radius: 16px; display: block; margin-bottom: 20px; }
  h1 { font-size: 26px; margin: 0 0 8px; font-weight: 650; }
  p { margin: 8px 0; color: var(--p); } p.small { font-size: 14px; color: var(--small); }
  .row { margin-top: 22px; display: flex; gap: 12px; flex-wrap: wrap; }
  button { font: inherit; padding: 10px 20px; border-radius: 10px; border: 1px solid var(--bd); background: var(--btn); color: var(--fg); cursor: pointer; }
  button.main { background: #f5b800; border-color: #f5b800; color: #111; font-weight: 600; }
  button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  pre { margin: 18px 0 0; padding: 14px; background: var(--prebg); border: 1px solid var(--prebd); border-radius: 10px; max-height: 44vh; overflow: auto; white-space: pre-wrap; word-break: break-word; font: 13px/1.45 ui-monospace, Menlo, Consolas, monospace; color: var(--pre); }
  pre:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  pre:empty { display: none; }
  button.link { padding: 0; border: 0; background: none; color: inherit; text-decoration: underline; font-size: inherit; }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--spin); border-top-color: #f5b800; border-radius: 50%; animation: s 0.9s linear infinite; vertical-align: -2px; margin-right: 8px; }
  ul.hives { list-style: none; padding: 0; margin: 16px 0 0; display: grid; gap: 8px; }
  ul.hives li { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border: 1px solid var(--bd); border-radius: 10px; background: var(--row); }
  ul.hives .who { flex: 1; min-width: 0; } ul.hives .who b { display: block; overflow-wrap: anywhere; } ul.hives .who span { font-size: 14px; color: var(--small); overflow-wrap: anywhere; }
  ul.hives button { padding: 6px 14px; }
  form.connect { margin-top: 16px; display: flex; gap: 12px; flex-wrap: wrap; }
  form.connect label { flex-basis: 100%; color: var(--p); }
  input { font: inherit; flex: 1; min-width: 220px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--bd); background: var(--prebg); color: var(--fg); }
  input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  p.err { color: var(--err); } p.err:empty { display: none; }
  @keyframes s { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
  @media (prefers-color-scheme: light) { :root { --bg:#fff; --fg:#1a1a1a; --p:#444; --small:#666; --bd:#bbb; --btn:#f3f3f3; --prebd:#ddd; --prebg:#f7f7f7; --pre:#222; --spin:#bbb; --focus:#000; --err:#b00020; --row:#f7f7f7; } }
</style></head>
<body><main>
  <img src="build/icon.png" alt="">
  <div id="say" aria-live="polite" aria-atomic="true">
  <h1 id="title" tabindex="-1">Hive</h1>
  <div id="text"></div>
  </div>
  <div class="row" id="buttons"></div>
  <p class="small" id="ver"></p>
  <pre id="log" role="log" tabindex="0" aria-label="What the installer said"></pre>
</main>
<script>
const $ = id => document.getElementById(id);
const how = {
  win32: "The Hive runs on Linux, so it makes a separate Linux system called Hive inside Windows (WSL 2), with your Windows files switched off for the agents. Windows may ask for permission once, and may need a restart.",
  darwin: "The Hive runs on Linux, so it makes a small Linux machine on this Mac for it, with none of your Mac's folders inside. It needs about 15 GB free. The Mac version is still a test build.",
  linux: "It installs in a folder of your own account (~/hive) and needs no password. Agents work in a sandbox around that folder.",
};
const screens = {
  welcome: p => ({ title: "Set up the Hive", text: ["The Hive isn't on this computer yet. This installs it, which takes a few minutes and needs the internet.", how[p.platform] || how.linux, ...(p.platform === 'linux' ? ["Before anything is changed, it shows you what the agents will be able to reach and asks you to accept."] : [])], buttons: [["Install", "main", () => hive.install(false)], ["Not now", "", () => hive.quit()]] }),
  installing: () => ({ title: "Installing the Hive", spin: true, text: ["This takes a few minutes. You can leave this window open and do something else."], buttons: [] }),
  accept: () => ({ title: "Before it installs", text: ["Read what it says below. Nothing has been changed so far."], buttons: [["Accept and install", "main", () => { $('log').textContent = ''; hive.install(true); }], ["Don't install", "", () => hive.quit()]], keep: true }),
  restart: () => ({ title: "Restart Windows", text: ["Windows installed the part the Hive needs (WSL 2), and has to restart before it works. Restart, then open Hive again and press Install: it carries on from there."], buttons: [["Close", "main", () => hive.quit()]], keep: true }),
  failed: () => ({ title: "The install stopped", text: ["What it said is below. Trying again carries on from where it stopped."], buttons: [["Try again", "main", () => { $('log').textContent = ''; hive.install(false); }], ["Copy what it said", "", () => { hive.copy($('title').textContent + '\n\n' + $('log').textContent + '\n\nHive app ' + hive.version); }], ["Close", "", () => hive.quit()]], keep: true }),
  starting: () => ({ title: "Opening the Hive", spin: true, text: ["Starting it up. After the computer has just been turned on this can take a minute or two."], buttons: [["Close", "", () => hive.quit()]] }),
  // Many Hives (step 3): the list, Connect, and a remote Hive that didn't answer. Everything a server sent is shown as text.
  hives: p => ({ title: "Your Hives", text: ["Each Hive keeps its own sign-in. Open one to show it in this window."], body: hiveList(p.list || []), buttons: [["Connect to a Hive…", "main", () => hive.connectScreen()], ["Back", "", () => hive.back()]] }),
  connect: () => ({ title: "Connect to a Hive", text: ["Type the Hive's address as you would open it in a browser, for example hive.example.com. A Hive on this computer's own address (http://127.0.0.1:…) works too."], body: connectForm(), buttons: [["Back", "", () => hive.back()]], focus: 'address' }),
  cantreach: p => ({ title: `Can't reach ${p.name || 'this Hive'}`, text: [`The app couldn't open ${p.host || 'it'}.`, ...(p.why ? [p.why] : [])], buttons: [["Try again", "main", () => hive.retryHive()], ["Open in browser", "", () => hive.browserHive()], ["Hives…", "", () => hive.hives()]] }),
  nostart: p => ({ title: "The Hive didn't start", text: ["It's installed, but it didn't answer."], note: p.note, buttons: [["Try again", "main", () => hive.retry()], ["Repair (run the installer again)", "", () => hive.install(false)], ["Copy what it said", "", () => { hive.copy($('title').textContent + '\n\n' + $('log').textContent + '\n\nHive app ' + hive.version); }], ["Close", "", () => hive.quit()]] }),
};
function hiveList(list) {
  const ul = document.createElement('ul'); ul.className = 'hives';
  for (const h of list) {
    const li = document.createElement('li'), who = document.createElement('div'), b = document.createElement('b'), sp = document.createElement('span');
    who.className = 'who'; b.textContent = h.name + (h.current ? ' (showing)' : ''); sp.textContent = h.where || ''; who.append(b, sp);
    const open = document.createElement('button'); open.id = 'open-' + h.id; open.textContent = 'Open'; open.setAttribute('aria-label', 'Open ' + h.name);
    open.onclick = () => hive.openHive(h.id);
    li.append(who, open);
    if (h.remote) {   // removing asks once more on the button itself
      const rm = document.createElement('button'); rm.id = 'remove-' + h.id; rm.textContent = 'Remove'; rm.setAttribute('aria-label', 'Remove ' + h.name);
      rm.onclick = () => { if (rm.dataset.sure) return hive.removeHive(h.id); rm.dataset.sure = '1'; rm.textContent = 'Remove it and its sign-in'; };
      li.append(rm);
    }
    ul.append(li);
  }
  return ul;
}
function connectForm() {
  const f = document.createElement('form'); f.className = 'connect';
  const l = document.createElement('label'); l.htmlFor = 'address'; l.textContent = "The Hive's address";
  const i = document.createElement('input'); i.id = 'address'; i.type = 'text'; i.autocomplete = 'off'; i.spellcheck = false; i.setAttribute('autocapitalize', 'off'); i.placeholder = 'hive.example.com';
  const go = document.createElement('button'); go.id = 'go'; go.type = 'submit'; go.className = 'main'; go.textContent = 'Connect';
  const err = document.createElement('p'); err.id = 'err'; err.className = 'err'; err.setAttribute('role', 'alert');
  f.onsubmit = e => { e.preventDefault(); err.textContent = ''; go.disabled = true; go.textContent = 'Connecting…'; hive.connect(i.value); };
  f.append(l, i, go, err);
  return f;
}
function show(state, p) {
  const s = (screens[state] || screens.welcome)(p || {});
  $('title').textContent = s.title;
  $('text').replaceChildren(...s.text.map((t, i) => { const e = document.createElement('p'); if (i === 0 && s.spin) { const sp = document.createElement('span'); sp.className = 'spin'; e.append(sp); } e.append(t); return e; }), ...(s.body ? [s.body] : []));
  $('buttons').replaceChildren(...s.buttons.map(([label, cls, fn]) => { const b = document.createElement('button'); b.textContent = label; b.className = cls; b.onclick = fn; return b; }));
  if (!s.keep && state !== 'installing') $('log').textContent = s.note || '';
  (s.focus ? $(s.focus) : $('title')).focus();   // a screen change moves the reader to the new heading; Tab then reaches the buttons
}
$('ver').textContent = 'Hive app ' + hive.version;
if (hive.rosetta) {   // the Intel app on an Apple chip Mac
  const b = document.createElement('button'); b.id = 'rosetta'; b.className = 'link';
  b.textContent = 'This Mac has an Apple chip: the Apple chip download opens faster'; b.onclick = () => hive.chipDownload();
  $('ver').append(' · ', b);
}
hive.on('state', show);
hive.on('newer', v => {
  if ($('newer')) return;
  const b = document.createElement('button'); b.id = 'newer'; b.className = 'link';
  b.textContent = `A newer Hive app (${v}) is available`; b.onclick = () => hive.download();
  $('ver').append(' · ', b);
});
hive.askNewer();
hive.on('connect-error', m => { const err = $('err'), go = $('go'); if (!err) return; err.textContent = m; go.disabled = false; go.textContent = 'Connect'; $('address').focus(); });
hive.on('log', t => { const l = $('log'); l.textContent += t; l.scrollTop = l.scrollHeight; });
show('starting', {});
</script>
</body></html>
