<!doctype html><html><body style="font:16px sans-serif;margin:30px">
<h3>Contact and delivery</h3>
<p>Email <input id="email" autocomplete="email"> Phone <input id="phone" autocomplete="tel"></p>
<p>Name <input id="name"> Street <input id="line1"> Apt <input id="line2"></p>
<p>City <input id="city"> State <select id="state"><option>New York</option><option>California</option></select> Zip <input id="zip"></p>
<button type="button" id="next">Continue</button>
<div id="side" style="margin-top:20px;font:bold 18px sans-serif">Your information<br><span id="e"></span><br><span id="n"></span><br><span id="a"></span><br><span id="p"></span></div>
<p id="sum">Subtotal $27.00</p>
<button id="place">Place order</button>
<script>
// the sidebar echoes what was typed, like Adafruit's "Your Information"; #split draws the name over two elements, so no one text node holds it
document.getElementById('next').onclick = () => {
  const v = (id) => document.getElementById(id).value, ph = v('phone').replace(/\D/g, '');
  document.getElementById('e').textContent = v('email');
  const nm = v('name').split(' ');
  if (location.hash === '#split') document.getElementById('n').innerHTML = nm.slice(0, -1).join(' ') + ' <b>' + nm[nm.length - 1] + '</b>';
  else document.getElementById('n').textContent = v('name');
  document.getElementById('a').textContent = v('line1') + ', ' + v('city') + ', ' + v('state');
  document.getElementById('p').textContent = '(' + ph.slice(0, 3) + ') ' + ph.slice(3, 6) + '-' + ph.slice(6);
  // the quote depends on the address: west coast $8.50 shipping, else $5.87
  const ship = v('zip').startsWith('9') ? 8.50 : 5.87;
  document.getElementById('sum').textContent = 'Subtotal $27.00 · Shipping $' + ship.toFixed(2) + ' · Tax $2.13 · Total $' + (27 + ship + 2.13).toFixed(2);
};
</script>
</body></html>
