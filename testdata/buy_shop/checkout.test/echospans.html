<!doctype html><html><head><style>body{font:22px sans-serif;margin:30px} input{font:22px monospace;width:420px}</style></head><body><h1>A shop that echoes the card in groups</h1>
<label>Card number <input id="cc" oninput="const d=this.value.replace(/\D/g,'');document.getElementById('echo').innerHTML=(d.match(/.{1,4}/g)||[]).map(g=>'<span>'+g+'</span>').join(' ')"></label>
<p id="echo" style="font:28px monospace"></p><p>Total $37.63</p>
</body></html>
