<!doctype html><html><head><title>Dummy checkout</title><style>body{font:20px sans-serif;margin:30px} input{font:22px monospace;width:420px;padding:6px;margin:4px 0} iframe{border:1px solid #888;width:520px;height:190px}</style></head>
<body><h1>Dummy checkout (test fixture)</h1>
<p>1 x Aluminum tube, 4 ft &mdash; Subtotal $27.00 &middot; Shipping $8.50 &middot; Tax $2.13</p>
<p id="total">Total <b>$37.63</b></p>
<label>Email <input id="email" type="email" autocomplete="email"></label><br>
<label>Phone <input id="phone" type="tel"></label><br>
<label>Address <textarea id="addr" rows="2" cols="40"></textarea></label><br>
<label>Card number (same page) <input id="cc" autocomplete="cc-number" inputmode="numeric"></label><br>
<label>Zip <input id="zip" type="number"></label><br>
<iframe id="pay" src="https://pay.test/card.html"></iframe><br>
<button id="place" onclick="document.body.innerHTML='<h1>Order placed</h1><p>Order 55120. Total $37.63. Paid with card ending 4242.</p>'">Place order</button>
<script>if (location.hash === '#higher') document.getElementById('total').innerHTML = 'Total <b>$41.00</b>';</script>
</body></html>
