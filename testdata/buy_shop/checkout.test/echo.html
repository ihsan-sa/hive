<!doctype html><html><head><title>Echoing checkout</title><style>body{font:24px sans-serif;margin:30px} input{font:22px monospace;width:420px}</style></head>
<body><h1>A shop that echoes the card back as text</h1>
<label>Card number <input id="cc" oninput="document.getElementById('echo').textContent='You typed: '+this.value"></label>
<p id="echo" style="font:28px monospace"></p><p>Total $37.63</p>
</body></html>
