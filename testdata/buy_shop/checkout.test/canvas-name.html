<!doctype html><html><body style="font:16px sans-serif;margin:30px">
Name <input id="name"> <button type="button" id="next">Continue</button><br>
<canvas id="c" width="700" height="80"></canvas>
<script>
// the name drawn on a canvas: no text node, no field, so the mask can't see it; the OCR must
document.getElementById('next').onclick = () => {
  const x = document.getElementById('c').getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, 700, 80);
  x.fillStyle = '#000'; x.font = 'bold 36px sans-serif'; x.fillText('Ship to ' + document.getElementById('name').value, 10, 50);
};
</script>
</body></html>
