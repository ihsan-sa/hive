<!doctype html><html><body style="font:16px sans-serif;margin:30px">
<h3>Echoes</h3>
<p>Email <input id="email" type="email"> Phone <input id="phone" type="tel"> Name <input id="name"></p>
<p>Street <input id="line1"> City <input id="city"> Zip <input id="zip"></p>
<button type="button" id="next">Continue</button>
<div id="out" style="margin-top:20px;font:bold 18px sans-serif"></div>
<script>
// what text nodes don't hold, and what a split or a frame does: a chosen option, a button's value, a placeholder, a phone over
// three elements, a same-origin frame and a cross-origin one (pay.test) echoing what was typed
document.getElementById('next').onclick = () => {
  const v = (id) => document.getElementById(id).value, ph = v('phone').replace(/\D/g, '').slice(-10), out = document.getElementById('out');
  const sel = document.createElement('select'); sel.id = 'pick';
  for (const t of ['Someone else', v('name')]) { const o = document.createElement('option'); o.text = t; sel.add(o); }
  sel.selectedIndex = 1;
  const btn = document.createElement('input'); btn.type = 'button'; btn.value = v('email');
  const pl = document.createElement('input'); pl.placeholder = v('line1'); pl.style.width = '300px';
  const sp = document.createElement('div'); sp.innerHTML = 'Call <span>(' + ph.slice(0, 3) + ')</span> <b>' + ph.slice(3, 6) + '</b>-<i>' + ph.slice(6) + '</i>';
  const same = document.createElement('iframe'); same.srcdoc = '<body style="font:bold 18px sans-serif">Ship to ' + v('line1').replace(/</g, '') + '</body>';
  const cross = document.createElement('iframe'); cross.src = 'https://pay.test/echo.html';
  for (const f of [same, cross]) { f.style.width = '520px'; f.style.height = '60px'; }
  cross.onload = () => cross.contentWindow.postMessage(v('email') + ' / ' + v('name') + ' / ' + v('line1'), '*');
  out.append(sel, document.createElement('br'), btn, document.createElement('br'), pl, sp, same, document.createElement('br'), cross);
};
</script>
</body></html>
