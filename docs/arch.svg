<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="24" y="32" font-size="17" font-weight="bold" fill="#222">The Hive: who does what, and where it runs</text>
<rect x="12" y="188" width="1080" height="90" rx="10" fill="#edf6ed" stroke="#4f8a4f" stroke-dasharray="6 4"/>
<text x="242" y="203" font-size="12" font-weight="bold" fill="#4f8a4f">Sandboxes: one per agent turn or test run, no GitHub login, network only through the proxy</text>
<rect x="12" y="320" width="1080" height="90" rx="10" fill="#edf1fa" stroke="#4d68a3" stroke-dasharray="6 4"/>
<text x="462" y="335" font-size="12" font-weight="bold" fill="#4d68a3">The daemon: runs as you, on your machine</text>
<rect x="464" y="78" width="176" height="56" rx="6" fill="#fff4d6" stroke="#333"/>
<text x="552" y="102" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">You</text>
<text x="552" y="120" font-size="11" text-anchor="middle" fill="#555">control center, hive ask</text>
<rect x="24" y="210" width="176" height="56" rx="6" fill="#ffffff" stroke="#333"/>
<text x="112" y="234" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">Lead</text>
<text x="112" y="252" font-size="11" text-anchor="middle" fill="#555">turns asks into briefs</text>
<rect x="244" y="210" width="176" height="56" rx="6" fill="#ffffff" stroke="#333"/>
<text x="332" y="234" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">Workers</text>
<text x="332" y="252" font-size="11" text-anchor="middle" fill="#555">build one brief each</text>
<rect x="464" y="210" width="176" height="56" rx="6" fill="#ffffff" stroke="#333"/>
<text x="552" y="234" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">Reviewer</text>
<text x="552" y="252" font-size="11" text-anchor="middle" fill="#555">read-only, exact commit</text>
<rect x="684" y="210" width="176" height="56" rx="6" fill="#ffffff" stroke="#333"/>
<text x="772" y="234" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">Tests</text>
<text x="772" y="252" font-size="11" text-anchor="middle" fill="#555">fresh clone, main&#39;s command</text>
<rect x="904" y="210" width="176" height="56" rx="6" fill="#ffffff" stroke="#333"/>
<text x="992" y="234" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">Warden, tribunal</text>
<text x="992" y="252" font-size="11" text-anchor="middle" fill="#555">weigh steps past a sandbox</text>
<rect x="24" y="342" width="176" height="56" rx="6" fill="#ffffff" stroke="#333"/>
<text x="112" y="366" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">Egress proxy</text>
<text x="112" y="384" font-size="11" text-anchor="middle" fill="#555">refuses this machine, LAN</text>
<rect x="244" y="342" width="176" height="56" rx="6" fill="#ffffff" stroke="#333"/>
<text x="332" y="366" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">Journal, queue</text>
<text x="332" y="384" font-size="11" text-anchor="middle" fill="#555">score: keep or revert</text>
<rect x="464" y="342" width="176" height="56" rx="6" fill="#ffffff" stroke="#333"/>
<text x="552" y="366" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">Effects</text>
<text x="552" y="384" font-size="11" text-anchor="middle" fill="#555">only holder of GitHub login</text>
<rect x="904" y="342" width="176" height="56" rx="6" fill="#ffffff" stroke="#333"/>
<text x="992" y="366" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">Approved steps</text>
<text x="992" y="384" font-size="11" text-anchor="middle" fill="#555">digest-pinned scripts</text>
<rect x="24" y="474" width="176" height="56" rx="6" fill="#f4f4f4" stroke="#333"/>
